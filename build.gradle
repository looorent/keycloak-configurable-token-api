buildscript {
    ext.keycloak_version = "26.5.5"
    repositories {
        mavenCentral()
    }
}

group = "be.looorent"
version = "26.5.5"

apply plugin: "java"

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.keycloak:keycloak-core:${keycloak_version}"
    compileOnly "org.keycloak:keycloak-server-spi:${keycloak_version}"
    compileOnly "org.keycloak:keycloak-server-spi-private:${keycloak_version}"
    compileOnly "org.keycloak:keycloak-services:${keycloak_version}"
    compileOnly "org.jboss.logging:jboss-logging:3.5.3.Final"
}

task copyJar(type: Copy) {
    into "dist"
    from "build/libs/keycloak-configurable-token-${version}.jar"
}

build.finalizedBy(copyJar)